<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Visual — 张筱周</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: 
      linear-gradient(rgba(190,215,235,0.45), rgba(190,215,235,0.45)),
      #e8f0f7 url('bg-mandala.jpg') center center fixed;
    background-size: cover;
    color: #2a3a4a;
    font-family: "STKaiti", "KaiTi", "楷体", "Kaiti SC", "FangSong", serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    padding-top: 80px;
  }
  a { text-decoration: none; color: inherit; }
  /* 01 顶部导航 */
  .nav {
    position: fixed; top:0; left:0; right:0;
    display: flex; justify-content: space-between; align-items: center;
    padding: 18px 40px;
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 100;
  }
  .nav .back { font-size: 13px; color: #6a8aab; letter-spacing: 1px; transition: color .2s; }
  .nav .back:hover { color: #2a4a6a; }
  .nav-right { display: flex; gap: 16px; align-items: center; }
  .nav-logo { font-weight: 600; font-size: 15px; color: #2a3a4a; }
  .nav-num { font-size: 12px; color: #8a9fb8; letter-spacing: 2px; }

  .container {
    position: relative;
    max-width: 860px;
    margin: 0 auto 60px;
    padding: 60px 50px 100px;
    background: rgba(255,255,255,0.42);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 14px;
    box-shadow: 0 8px 32px rgba(50,80,120,0.08);
  }

  /* 02 作品标题区 */
  .work-tag {
    font-size: 12px; color: #8a9fb8; letter-spacing: 3px;
    text-transform: uppercase; margin-bottom: 14px;
  }
  .work-header h1 {
    font-size: clamp(28px, 4vw, 44px);
    font-weight: 400; letter-spacing: 3px;
    margin-bottom: 18px; color: #1f3a55;
  }
  .work-meta {
    display: flex; gap: 20px; margin-bottom: 28px;
    font-size: 13px; color: #6a8aab; letter-spacing: 1px;
  }
  .work-intro {
    color: #4a6078; line-height: 1.9; font-size: 15px;
    margin-bottom: 40px; padding-bottom: 28px;
    border-bottom: 1px solid #d0e0ee;
  }

  /* 03 核心作品展示 */
  .work-showcase {
    position: relative;
    z-index: 1; margin-bottom: 44px; }
  .placeholder {
    width: 100%; aspect-ratio: 16 / 10;
    border: 2px dashed #b0c4d8;
    border-radius: 8px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 8px;
    color: #9ab0c8; font-size: 14px; letter-spacing: 3px;
    background: rgba(255,255,255,0.5);
  }
  .placeholder .sub { font-size: 11px; letter-spacing: 2px; color: #b0c4d8; }

  /* 04 作品说明区 */
  .work-notes {
    position: relative;
    z-index: 1;
    display: grid; grid-template-columns: 1fr 1fr; gap: 36px;
  }
  .note-block h3 {
    font-size: 16px; font-weight: 400; color: #2a4a6a;
    letter-spacing: 2px; margin-bottom: 14px;
    padding-left: 10px; border-left: 3px solid #8ab4d8;
  }
  .note-block p {
    color: #4a6078; line-height: 1.9; font-size: 14px; font-weight: 300;
  }

  

  @media (max-width: 768px) {
    .nav { padding: 16px 20px; }
    .container {
    position: relative; padding: 40px 24px 60px; margin: 0 16px 40px; }
    .work-notes {
    position: relative;
    z-index: 1; grid-template-columns: 1fr; gap: 24px; }
  }
</style>
</head>
<body>
  <nav class="nav">
    <a href="index.html" class="back">← 返回作品集</a>
    <div class="nav-right">
      <span class="nav-logo">张筱周</span>
      <span class="nav-num">04 / 10</span>
    </div>
  </nav>
  <div class="container"><!-- 02 作品标题区 -->
    <div class="work-header">
      <div class="work-tag">3D Visual</div>
      <h1>三维视觉渲染</h1>
      <div class="work-meta">
        <span>视觉实验</span><span>2025</span><span>独立设计</span>
      </div>
      <p class="work-intro">此处为项目简介占位，后续替换为对应作品的介绍内容。</p>
    </div>

    <!-- 03 核心作品展示 -->
    <div class="work-showcase">
      <div class="placeholder">
        <div>作品主视觉占位</div>
        <div class="sub">16:9 · 替换为项目最终成品图</div>
      </div>
    </div>

    <!-- 04 作品说明区 -->
    <div class="work-notes">
      <div class="note-block">
        <h3>创作灵感</h3>
        <p>此处为创作灵感说明占位，后续替换为对应内容。</p>
      </div>
      <div class="note-block">
        <h3>设计思路</h3>
        <p>此处为设计思路说明占位，后续替换为对应内容。</p>
      </div>
    </div>
  </div>
</body>
</html>
